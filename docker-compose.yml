services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sozmor
      POSTGRES_PASSWORD: sozmor
      POSTGRES_DB: sozmor
    # 5434 на хосте — 5432/5433 заняты другими локальными сервисами на машине разработчика.
    ports:
      - "5434:5432"
    volumes:
      - sozmor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sozmor -d sozmor"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  sozmor_pgdata:
