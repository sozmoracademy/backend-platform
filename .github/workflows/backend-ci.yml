name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sozmor
          POSTGRES_PASSWORD: sozmor
          POSTGRES_DB: sozmor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sozmor -d sozmor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sozmor:sozmor@localhost:5432/sozmor_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CREDENTIALS_ENC_KEY: ci-credentials-enc-key
      ACCESS_TTL: 15m
      REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      COOKIE_DOMAIN: localhost
      SCHOOL_TZ: Asia/Bishkek
      SEED_TODAY: "2026-08-18"
      THROTTLE_TTL: "300"
      THROTTLE_LIMIT: "1000"
      BUNNY_STREAM_LIBRARY_ID: "999999"
      BUNNY_STREAM_API_KEY: ci-bunny-api-key
      BUNNY_STREAM_CDN_HOSTNAME: vz-ci.b-cdn.net
      BUNNY_STREAM_TOKEN_KEY: ci-bunny-token-key
      BUNNY_WEBHOOK_KEY: ci-bunny-webhook-key
      BUNNY_PLAYBACK_TTL: "21600"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx prisma migrate deploy

      - run: npm test

      - run: npm run test:e2e

      - run: npm run build
